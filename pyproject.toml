[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "calendar-agent-protocol"
version = "1.0.0"
description = "Executable protocol models for Calendar Agent V1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "alembic>=1.14,<2",
  "jsonschema[format]>=4.23,<5",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/calendar_agent_protocol"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["？"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["calendar_agent_protocol"]
